apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: roboshop-ebs  #storage class name 
reclaimPolicy: Retain   # even pod deleted then disk still be there 
provisioner: ebs.csi.aws.com  
volumeBindingMode: WaitForFirstConsumer #disk will be created when pod is getting created
                            #will create disk after create created pod 
